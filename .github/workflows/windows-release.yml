name: Build Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        default: v3.2.0
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified runtime and build tools
        run: |
          python -m pip install pypdf==6.10.0 Pillow==12.3.0
          New-Item -ItemType Directory -Force work/package-v2,work/desktop-build | Out-Null
          Invoke-WebRequest https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip -OutFile work/package-v2/python-3.12.10-embed-amd64.zip
          if ((Get-FileHash work/package-v2/python-3.12.10-embed-amd64.zip).Hash -ne '4ACBED6DD1C744B0376E3B1CF57CE906F9DC9E95E68824584C8099A63025A3C3') { throw 'Python archive mismatch' }
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.2903.40/microsoft.web.webview2.1.0.2903.40.nupkg -OutFile work/desktop-build/webview2.nupkg
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe -OutFile work/desktop-build/inno.exe
          if ((Get-FileHash work/desktop-build/inno.exe).Hash -ne 'F3C42116542C4CC57263C5BA6C4FEABFC49FE771F2F98A79D2F7628B8762723B') { throw 'Inno archive mismatch' }
          $folder=Join-Path $pwd 'work/desktop-build/inno643'
          Start-Process work/desktop-build/inno.exe -WindowStyle Hidden -Wait -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="'+$folder+'"'))
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124701' -OutFile work/desktop-build/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
          $sig=Get-AuthenticodeSignature work/desktop-build/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'WebView2 signature invalid' }
      - name: Test and build
        working-directory: src
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE) { throw 'Tests failed' }
          node tests/test_storage.cjs
          if ($LASTEXITCODE) { throw 'Storage tests failed' }
          python scripts/build_package.py
          if ($LASTEXITCODE) { throw 'Portable build failed' }
          python scripts/verify_package.py
          if ($LASTEXITCODE) { throw 'Portable checks failed' }
          python scripts/build_desktop.py
          if ($LASTEXITCODE) { throw 'Desktop build failed' }
      - name: Upload installer to existing draft
        run: |
          $release=gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if (!$release.isDraft) { throw 'Only draft releases may be updated by this workflow' }
          Copy-Item outputs/曜石-Lithos-v3.2.0-Setup-x64.exe outputs/Lithos-v3.2.0-Windows-x64-Setup.exe
          gh release upload $env:RELEASE_TAG outputs/Lithos-v3.2.0-Windows-x64-Setup.exe --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { throw 'Installer upload failed' }
